<app-card-search
  name="Complicações"
  [service]="complicacoesService"
  [searchColumn]="['nome', 'descricao']"
  [colsGrid]="3"
  [rowHeight]="300"
  [suggestions]="[]"
  [columns]="[{ key: 'nome', label: 'Nome' }]"
  gutterSizeGrid="10px">
  <ng-template let-item>
    <mat-card class="card-game">
      <mat-card-title class="mat-card-title">
        {{ item.nome.toUpperCase() }}
      </mat-card-title>
      <mat-card-content class="">
        <div class="content">
          <div class="row">
            <div class="col-sm-12">
              <hr class="" />
            </div>
          </div>
          <div class="row mt-4">
            <div class="col-sm-12 d-flex flex-wrap gap-2">
              @if (item.classe) {
                <button class="btn btn-sm btn-outline-secondary" disabled>
                  {{ item.classe?.nome?.toUpperCase() }}
                </button>
              }
              <button *ngIf="item.e_restritiva" class="btn btn-sm btn-outline-secondary" disabled>RESTRITIVA †</button>

              <button *ngIf="item.e_idade" class="btn btn-sm btn-outline-secondary" disabled>IDADE</button>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-12 mt-4">
              {{ item.descricao }}
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </ng-template>
</app-card-search>
